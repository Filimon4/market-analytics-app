name: Build and Publish server

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/market-analytics-server:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/market-analytics-server:latest
          build-args: |
            DATABASE_URL=${{ vars.DATABASE_URL }}
            HTTP_DOMAIN=${{ vars.HTTP_DOMAIN }}
            HTTP_HOST=${{ vars.HTTP_HOST }}
            HTTP_PORT=${{ vars.HTTP_PORT }}
            NODE_ENV=${{ vars.NODE_ENV }}
            HTTP_OPEN_API_PREFIX=${{ vars.HTTP_OPEN_API_PREFIX }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRES=${{ vars.JWT_ACCESS_EXPIRES }}
            JWT_REFRESH_EXPIRES=${{ vars.JWT_REFRESH_EXPIRES }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_publish
    environment: prod
    env:
      SERVER_HOST: '195.93.252.172'
      SERVER_USER: root
      DEPLOY_PATH: /opt/market-analytics-server
      SSH_OPTS: -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SERVER_HOST" || (echo "SERVER_HOST is empty" && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY secret is empty" && exit 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "echo SSH connection OK"

      - name: Upload deployment files
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.* \
            -czf - . | ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${DEPLOY_PATH}' && tar -xzf - -C '${DEPLOY_PATH}'"

      - name: Write production env file
        run: |
          cat <<'EOF' | ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "cat > '${DEPLOY_PATH}/.env.prod'"
          DATABASE_URL=${{ vars.DATABASE_URL }}
          HTTP_DOMAIN=${{ vars.HTTP_DOMAIN }}
          HTTP_PORT=${{ vars.HTTP_PORT }}
          NODE_ENV=${{ vars.NODE_ENV }}
          HTTP_OPEN_API_PREFIX=${{ vars.HTTP_OPEN_API_PREFIX }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRES=${{ vars.JWT_ACCESS_EXPIRES }}
          JWT_REFRESH_EXPIRES=${{ vars.JWT_REFRESH_EXPIRES }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF

      # - name: Deploy to server
      #   run: |
      #     ssh "${SERVER_USER}@${SERVER_HOST}" "
      #       cd '${DEPLOY_PATH}' &&
      #       docker compose --env-file .env.prod -f docker-compose.prod.yml pull nginx client postgres &&
      #       docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --remove-orphans
      #     "
