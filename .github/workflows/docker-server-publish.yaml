name: Build and Publish server

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/market-analytics-server:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/market-analytics-server:latest
          build-args: |
            DATABASE_URL=${{ vars.DATABASE_URL }}
            HTTP_DOMAIN=${{ vars.HTTP_DOMAIN }}
            HTTP_HOST=${{ vars.HTTP_HOST }}
            HTTP_PORT=${{ vars.HTTP_PORT }}
            NODE_ENV=${{ vars.NODE_ENV }}
            HTTP_OPEN_API_PREFIX=${{ vars.HTTP_OPEN_API_PREFIX }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRES=${{ vars.JWT_ACCESS_EXPIRES }}
            JWT_REFRESH_EXPIRES=${{ vars.JWT_REFRESH_EXPIRES }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_publish
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: '.'
          target: /opt/market-analytics-server
          strip_components: 0
          rm: false
          overwrite: true

      - name: Write env file and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            {
              echo "DATABASE_URL=${{ vars.DATABASE_URL }}"
              echo "HTTP_DOMAIN=${{ vars.HTTP_DOMAIN }}"
              echo "HTTP_PORT=${{ vars.HTTP_PORT }}"
              echo "NODE_ENV=${{ vars.NODE_ENV }}"
              echo "HTTP_OPEN_API_PREFIX=${{ vars.HTTP_OPEN_API_PREFIX }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "JWT_ACCESS_EXPIRES=${{ vars.JWT_ACCESS_EXPIRES }}"
              echo "JWT_REFRESH_EXPIRES=${{ vars.JWT_REFRESH_EXPIRES }}"
              echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            } > /opt/market-analytics-server/.env.prod
            cd /opt/market-analytics-server
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --remove-orphans
